# Runs the checks on every push, which nothing did until now.
#
# There was a workflow to deploy the site and none to test it, so the only
# thing standing between a regression and the live page was somebody
# remembering to run `npm test` by hand. That is a bad place to keep a
# safeguard: it works right up until the round where it matters.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # One job a suite, in parallel. Run end to end they take about
    # twenty-five minutes, nearly all of it in `motion`, and a check that slow
    # gets ignored. Split, the wall clock is however long `motion` takes.
    #
    # fail-fast off on purpose: when two suites break, knowing about both is
    # worth more than finding out about the second one tomorrow.
    strategy:
      fail-fast: false
      matrix:
        suite: [rig, parts, motion, replay, smoke, warp, output]
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall fetches the wasm runtime and both tracking models, about
      # 26 MB. Deliberately not committed: they are reproducible.
      - run: npm ci

      # The suites drive a real browser. Playwright knows where it put its own
      # copy, which is why none of them name a path any more.
      - run: npx playwright install --with-deps chromium

      # A runner has no GPU and the whole model is drawn with WebGL2, so each
      # suite already asks Chromium for software rendering itself. Nothing to
      # set here — and nothing to point at a browser either.
      - run: node test/${{ matrix.suite }}.mjs
