# Publishes the tracker page to GitHub Pages from main. Pages serves over
# HTTPS, which the camera needs; the OBS page still needs the local server,
# because that is what carries tracking between the two pages.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an older one still running — but only for the same
# branch. Sharing one group across branches meant a push to the working branch
# cancelled a deploy of main that was already under way, which is how a merge
# could land, report itself deployed, and leave the old build on the site.
# Only main deploys (see below), so this still serialises deployments.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall fetches the wasm runtime and both tracking models, about
      # 26 MB. They are deliberately not committed: they are reproducible.
      - run: npm ci

      - run: npm run build
        env:
          # So the page can say which commit it is. Chasing a bug that was
          # already fixed, because a stale page was serving an old build, is
          # expensive and completely avoidable.
          VTUBER_BUILD: ${{ github.sha }}
          # Derived from the repo rather than hardcoded, so renaming it does
          # not silently 404 every model and leave a blank stage.
          VTUBER_BASE: /${{ github.event.repository.name }}/

      # enablement creates the Pages site if it does not exist yet, so this
      # needs no click in Settings first. Without it the whole run dies on
      # "Get Pages site failed" after a build that otherwise went fine.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Only the default branch may deploy: the github-pages environment refuses a
  # deployment from anywhere else, so a push to the working branch built fine
  # and then went red on this job every single time. A red cross that always
  # means nothing is worse than no check at all — it trains you to ignore the
  # one that matters. The branch still builds, which is the part worth knowing.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
