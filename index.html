<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VTuber Model</title>
    <!--
      Do not let the browser hold on to this page.

      The script and stylesheet are content-hashed, so a new build gives them
      new filenames and they can be cached forever. This file is what points at
      them, and a stale copy of it silently serves an old build — which looks
      exactly like a bug that was already fixed, and cost a round of chasing
      one that had been.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="stage" aria-label="Avatar stage">
      <div id="avatar-host"></div>

      <div id="hud">
        <button id="toggle-panel" type="button" title="Show or hide the controls (H)">☰</button>
        <span id="status" class="status status--idle">Camera off</span>
        <span id="fps" class="fps" hidden></span>
        <!-- Which build this is, on the stage rather than buried in the panel.
             "Am I even looking at the new one?" should not be a question that
             takes opening a drawer to answer. -->
        <span id="hud-build" class="hud-build"></span>
      </div>

      <!-- What this device actually drew, and what the tracker is reading.
           There is no console on a phone, and the faults that reached the user
           were visible here and nowhere else, so the answer goes on the screen
           where a screenshot catches it.

           It used to hide itself the instant the camera started, because
           whatever was on this page went out to OBS. OBS reads a separate page
           now, so that reason is gone — and the whole time it was hidden was
           exactly the time it had something to say. Tap it, or press D, to put
           it away. -->
      <button id="selfcheck" class="selfcheck" type="button" hidden
        title="What this device is drawing and reading — tap to hide (D)"></button>

      <div id="camera-preview" hidden>
        <span>camera</span>
      </div>

      <p id="first-run">
        Press <strong>Start camera</strong> to bring the model to life.
        <br />Everything runs on this machine — no video ever leaves it.
      </p>
    </main>

    <aside id="panel" aria-label="Controls">
      <div class="panel__head">
        <h1>VTuber Model</h1>
        <button id="close-panel" type="button" title="Hide the controls (H)">×</button>
      </div>
      <div class="panel__actions">
        <button id="start" class="btn btn--primary" type="button">Start camera</button>
        <button id="calibrate" class="btn" type="button" title="Sit straight, look at the camera, then press this (C)">
          Set neutral pose
        </button>
      </div>
      <div id="panel-body"></div>
      <div class="panel__foot">
        <button id="export" class="btn btn--ghost" type="button">Export settings</button>
        <button id="import" class="btn btn--ghost" type="button">Import</button>
        <button id="reset" class="btn btn--ghost" type="button">Reset all</button>
      </div>
      <div class="panel__build" id="build-stamp"></div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
