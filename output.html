<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VTuber Model — output</title>
    <!--
      The page OBS opens.

      Nothing here but the model. No controls, no status, no readout, no
      camera: whatever is on this page is what goes out to the stream, so
      there is nowhere safe to put a message. Anything that needs saying is
      said on the other page, which is the one you are looking at.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="data:," />
    <style>
      /* Transparent to the bottom, so a Browser Source composites onto the
         scene rather than onto a colour somebody has to key out. The stage's
         own background follows the setting, which is how the window-capture
         route still gets its chroma colour. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      #avatar-host { position: absolute; inset: 0; }
      #avatar-host canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <main id="stage">
      <div id="avatar-host"></div>
    </main>
    <script type="module" src="/src/output.js"></script>
  </body>
</html>
